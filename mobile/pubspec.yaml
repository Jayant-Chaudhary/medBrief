name: health_on_patient
description: MedBrief patient companion for Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  http_parser: ^4.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  image_picker: ^1.2.4
  record: 7.1.2
  flutter_foreground_task: 11.0.3
  socket_io_client: 3.1.6
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo-mark.png
